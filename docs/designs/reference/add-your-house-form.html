<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add your house</title>
<style>
  :root{
    --navy: #16294f;
    --navy-deep: #0d1a33;
    --accent: #2f5fd8;
    --accent-soft: #eaf0fe;
    --ink: #16192a;
    --ink-muted: #5b6072;
    --line: #dfe2ea;
    --line-soft: #eceef4;
    --paper: #fbfbfd;
    --white: #ffffff;
    --radius: 10px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--paper);
    font-family: -apple-system, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    display:flex;
    justify-content:center;
    padding: 56px 24px 80px;
  }

  .topbar{
    position:fixed; top:0; left:0; right:0;
    height:4px;
    background: linear-gradient(90deg, var(--navy) 0%, var(--accent) 100%);
  }

  .card{
    width:100%;
    max-width: 460px;
  }

  .eyebrow{
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }

  h1{
    font-size: 28px;
    line-height:1.2;
    letter-spacing:-0.015em;
    font-weight: 700;
    color: var(--navy-deep);
    margin: 0 0 8px;
  }

  .sub{
    font-size:14.5px;
    color: var(--ink-muted);
    margin: 0 0 36px;
    line-height:1.5;
  }

  .field{
    margin-bottom: 26px;
  }

  .field-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }

  label{
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
  }

  .hint{
    font-size:12px;
    color: var(--ink-muted);
  }

  .input-wrap{
    position:relative;
  }

  input[type="text"]{
    width:100%;
    height:48px;
    padding: 0 16px;
    font-size:15px;
    font-family: inherit;
    color: var(--ink);
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    outline:none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }

  input[type="text"]::placeholder{
    color:#a7abbb;
  }

  input[type="text"]:hover{
    border-color:#c3c8d6;
  }

  input[type="text"]:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  .zip-input{
    max-width: 160px;
  }

  .locate-btn{
    position:absolute;
    right:6px;
    top:50%;
    transform: translateY(-50%);
    width:36px;
    height:36px;
    border-radius:8px;
    border:none;
    background: var(--accent-soft);
    color: var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: background .15s ease;
  }

  .locate-btn:hover{
    background:#dbe6fc;
  }

  .locate-btn svg{ width:18px; height:18px; }

  fieldset{
    border:none;
    margin:0;
    padding:0;
  }

  legend{
    font-size: 13.5px;
    font-weight:600;
    color: var(--ink);
    padding:0;
    margin-bottom: 12px;
  }

  .option-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .option{
    position:relative;
  }

  .option input{
    position:absolute;
    opacity:0;
    width:100%;
    height:100%;
    top:0; left:0;
    margin:0;
    cursor:pointer;
  }

  .option-face{
    display:flex;
    align-items:center;
    gap:12px;
    height:50px;
    padding: 0 16px;
    border:1.5px solid var(--line);
    border-radius: var(--radius);
    background: var(--white);
    font-size:14.5px;
    font-weight:500;
    color: var(--ink);
    transition: border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }

  .option-face .dot{
    width:18px;
    height:18px;
    border-radius:50%;
    border: 1.5px solid #c3c8d6;
    flex-shrink:0;
    position:relative;
    transition: border-color .15s ease;
  }

  .option-face .dot::after{
    content:"";
    position:absolute;
    inset:3px;
    border-radius:50%;
    background: var(--accent);
    transform: scale(0);
    transition: transform .12s ease;
  }

  .option input:hover ~ .option-face{
    border-color:#c3c8d6;
  }

  .option input:checked ~ .option-face{
    border-color: var(--accent);
    background: var(--accent-soft);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  .option input:checked ~ .option-face .dot{
    border-color: var(--accent);
  }

  .option input:checked ~ .option-face .dot::after{
    transform: scale(1);
  }

  .option input:focus-visible ~ .option-face{
    outline: 2px solid var(--accent);
    outline-offset:2px;
  }

  .field-note{
    font-size:12.5px;
    color: var(--ink-muted);
    line-height:1.5;
    margin: 8px 2px 0;
  }

  .actions{
    margin-top: 34px;
  }

  button.continue{
    width:100%;
    height:52px;
    border:none;
    border-radius: var(--radius);
    background: var(--navy-deep);
    color:#fff;
    font-size:15.5px;
    font-weight:600;
    letter-spacing:.01em;
    cursor:pointer;
    transition: background .15s ease, transform .05s ease;
  }

  button.continue:hover{
    background: var(--navy);
  }

  button.continue:active{
    transform: translateY(1px);
  }

  .progress{
    display:flex;
    gap:6px;
    margin-bottom:28px;
  }

  .progress span{
    height:4px;
    flex:1;
    border-radius:2px;
    background: var(--line-soft);
  }

  .progress span.done{
    background: var(--accent);
  }
</style>
</head>
<body>
  <div class="topbar"></div>
  <div class="card">
    <div class="progress">
      <span class="done"></span>
      <span></span>
    </div>
    <p class="eyebrow">Step 1 of 2</p>
    <h1>Let's set up your home</h1>
    <p class="sub">We'll use this to build your personalized maintenance plan — what to check, when, and why it matters.</p>

    <div class="field">
      <div class="field-row">
        <label for="address">Address</label>
      </div>
      <div class="input-wrap">
        <input id="address" type="text" placeholder="123 Main Street">
      </div>
    </div>

    <div class="field">
      <div class="field-row">
        <label for="zip">ZIP code</label>
      </div>
      <input id="zip" class="zip-input" type="text" placeholder="00000" maxlength="5" inputmode="numeric">
    </div>

    <div class="field">
      <fieldset>
        <legend>House type</legend>
        <div class="option-list">
          <label class="option">
            <input type="radio" name="house-type" value="single-family" checked>
            <span class="option-face"><span class="dot"></span>Single family</span>
          </label>
          <label class="option">
            <input type="radio" name="house-type" value="condo">
            <span class="option-face"><span class="dot"></span>Condo</span>
          </label>
          <label class="option">
            <input type="radio" name="house-type" value="townhouse">
            <span class="option-face"><span class="dot"></span>Townhouse</span>
          </label>
          <label class="option">
            <input type="radio" name="house-type" value="other">
            <span class="option-face"><span class="dot"></span>Other</span>
          </label>
        </div>
      </fieldset>
      <p class="field-note">Your home type shapes which tasks show up on your checklist, and which ones we skip.</p>
    </div>

    <div class="actions">
      <button class="continue" type="button">Continue</button>
    </div>
  </div>
</body>
</html>
