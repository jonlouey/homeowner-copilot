<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>151 Waterhole Rd — Dashboard</title>
<style>
  :root{
    --navy: #16294f;
    --navy-deep: #0d1a33;
    --accent: #2f5fd8;
    --accent-soft: #eaf0fe;
    --amber: #b9720c;
    --amber-soft: #fdf1de;
    --amber-line: #f2ddb3;
    --ink: #16192a;
    --ink-muted: #5b6072;
    --ink-faint: #9195a5;
    --line: #dfe2ea;
    --line-soft: #eceef4;
    --paper: #fbfbfd;
    --white: #ffffff;
    --radius: 12px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--paper);
    font-family: -apple-system, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    display:flex;
    justify-content:center;
    padding: 48px 24px 80px;
  }

  .topbar{
    position:fixed; top:0; left:0; right:0;
    height:4px;
    background: linear-gradient(90deg, var(--navy) 0%, var(--accent) 100%);
  }

  .page{
    width:100%;
    max-width: 860px;
  }

  .header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom: 40px;
  }

  .eyebrow{
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color: var(--accent);
    margin: 0 0 8px;
  }

  h1{
    font-size: 30px;
    line-height:1.2;
    letter-spacing:-0.015em;
    font-weight: 700;
    color: var(--navy-deep);
    margin: 0;
  }

  .switch-home{
    display:inline-flex;
    align-items:center;
    gap:6px;
    height:38px;
    padding: 0 14px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: var(--white);
    color: var(--ink-muted);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition: border-color .15s ease, color .15s ease;
    white-space:nowrap;
    margin-top: 4px;
  }

  .switch-home:hover{
    border-color:#c3c8d6;
    color: var(--ink);
  }

  .switch-home svg{ width:14px; height:14px; }

  section{
    margin-bottom: 40px;
  }

  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 16px;
  }

  .section-title{
    font-size:15px;
    font-weight:700;
    color: var(--navy-deep);
  }

  .section-note{
    font-size:12.5px;
    color: var(--ink-muted);
  }

  .attention-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap:14px;
  }

  .attention-card{
    position:relative;
    display:block;
    background: var(--white);
    border: 1px solid var(--line);
    border-left: 3px solid var(--amber);
    border-radius: var(--radius);
    padding: 18px 18px 16px;
    text-decoration:none;
    color:inherit;
    transition: border-color .15s ease, box-shadow .15s ease, transform .1s ease;
  }

  .attention-card:hover{
    box-shadow: 0 4px 16px rgba(22,41,79,0.07);
    transform: translateY(-1px);
  }

  .attention-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom: 22px;
  }

  .attention-index{
    font-size:12px;
    font-weight:600;
    color: var(--ink-faint);
    letter-spacing:.02em;
  }

  .attention-icon{
    width:30px;
    height:30px;
    border-radius:8px;
    background: var(--amber-soft);
    color: var(--amber);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .attention-icon svg{ width:16px; height:16px; }

  .attention-title{
    font-size:16px;
    font-weight:600;
    color: var(--ink);
    margin: 0 0 12px;
  }

  .status-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    color: var(--amber);
    background: var(--amber-soft);
    border: 1px solid var(--amber-line);
    border-radius:999px;
    padding: 4px 10px;
  }

  .status-pill .dot{
    width:5px;
    height:5px;
    border-radius:50%;
    background: var(--amber);
  }

  .category-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap:14px;
  }

  .category-card{
    display:flex;
    align-items:center;
    gap:12px;
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    text-decoration:none;
    color:inherit;
    transition: border-color .15s ease, box-shadow .15s ease, transform .1s ease;
  }

  .category-card:hover{
    border-color: var(--accent);
    box-shadow: 0 4px 16px rgba(22,41,79,0.06);
    transform: translateY(-1px);
  }

  .category-icon{
    width:38px;
    height:38px;
    border-radius:9px;
    background: var(--accent-soft);
    color: var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  .category-icon svg{ width:19px; height:19px; }

  .category-body{
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:0;
  }

  .category-name{
    font-size:14.5px;
    font-weight:600;
    color: var(--ink);
  }

  .category-meta{
    font-size:12px;
    color: var(--ink-muted);
  }
</style>
</head>
<body>
  <div class="topbar"></div>
  <div class="page">
    <div class="header">
      <div>
        <p class="eyebrow">Your home</p>
        <h1>151 Waterhole Rd</h1>
      </div>
      <button class="switch-home" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 0 0 1 1h3m10-11l2 2m-2-2v10a1 1 0 0 1-1 1h-3m-6 0a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1m-6 0h6"/></svg>
        Switch home
      </button>
    </div>

    <section>
      <div class="section-head">
        <span class="section-title">Needs your attention</span>
        <span class="section-note">3 items</span>
      </div>
      <div class="attention-grid">
        <a class="attention-card" href="#">
          <div class="attention-top">
            <span class="attention-index">01</span>
            <span class="attention-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>
            </span>
          </div>
          <p class="attention-title">Electrical Panel</p>
          <span class="status-pill"><span class="dot"></span>Needs info</span>
        </a>

        <a class="attention-card" href="#">
          <div class="attention-top">
            <span class="attention-index">02</span>
            <span class="attention-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5Z"/></svg>
            </span>
          </div>
          <p class="attention-title">HVAC</p>
          <span class="status-pill"><span class="dot"></span>Needs info</span>
        </a>

        <a class="attention-card" href="#">
          <div class="attention-top">
            <span class="attention-index">03</span>
            <span class="attention-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11Z"/></svg>
            </span>
          </div>
          <p class="attention-title">Water Heater</p>
          <span class="status-pill"><span class="dot"></span>Needs info</span>
        </a>
      </div>
    </section>

    <section>
      <div class="section-head">
        <span class="section-title">Categories</span>
      </div>
      <div class="category-grid">
        <a class="category-card" href="#">
          <span class="category-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>
          </span>
          <span class="category-body">
            <span class="category-name">Systems</span>
            <span class="category-meta">7 items</span>
          </span>
        </a>

        <a class="category-card" href="#">
          <span class="category-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
          </span>
          <span class="category-body">
            <span class="category-name">Exterior</span>
            <span class="category-meta">9 items</span>
          </span>
        </a>

        <a class="category-card" href="#">
          <span class="category-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h.01M8 10h8M8 14h8M8 18h8"/></svg>
          </span>
          <span class="category-body">
            <span class="category-name">Appliances</span>
            <span class="category-meta">5 items</span>
          </span>
        </a>

        <a class="category-card" href="#">
          <span class="category-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5l-8-3Z"/></svg>
          </span>
          <span class="category-body">
            <span class="category-name">Safety</span>
            <span class="category-meta">2 items</span>
          </span>
        </a>
      </div>
    </section>
  </div>
</body>
</html>
