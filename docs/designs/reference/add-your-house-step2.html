<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add your house — step 2</title>
<style>
  :root{
    --navy: #16294f;
    --navy-deep: #0d1a33;
    --accent: #2f5fd8;
    --accent-soft: #eaf0fe;
    --ink: #16192a;
    --ink-muted: #5b6072;
    --line: #dfe2ea;
    --line-soft: #eceef4;
    --paper: #fbfbfd;
    --white: #ffffff;
    --radius: 10px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--paper);
    font-family: -apple-system, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    display:flex;
    justify-content:center;
    padding: 56px 24px 80px;
  }

  .topbar{
    position:fixed; top:0; left:0; right:0;
    height:4px;
    background: linear-gradient(90deg, var(--navy) 0%, var(--accent) 100%);
  }

  .card{
    width:100%;
    max-width: 640px;
  }

  .eyebrow{
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }

  h1{
    font-size: 28px;
    line-height:1.2;
    letter-spacing:-0.015em;
    font-weight: 700;
    color: var(--navy-deep);
    margin: 0 0 8px;
  }

  .sub{
    font-size:14.5px;
    color: var(--ink-muted);
    margin: 0 0 36px;
    line-height:1.5;
  }

  .progress{
    display:flex;
    gap:6px;
    margin-bottom:28px;
    max-width: 460px;
  }

  .progress span{
    height:4px;
    flex:1;
    border-radius:2px;
    background: var(--line-soft);
  }

  .progress span.done{
    background: var(--accent);
  }

  .group{
    margin-bottom: 32px;
  }

  .group-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 14px;
  }

  .group-title{
    font-size: 13.5px;
    font-weight:600;
    color: var(--ink);
  }

  .group-count{
    font-size:12px;
    color: var(--ink-muted);
  }

  .chip-list{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }

  .chip{
    position:relative;
  }

  .chip input{
    position:absolute;
    opacity:0;
    width:100%;
    height:100%;
    top:0; left:0;
    margin:0;
    cursor:pointer;
  }

  .chip-face{
    display:inline-flex;
    align-items:center;
    gap:7px;
    height:40px;
    padding: 0 16px;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    background: var(--white);
    font-size:14px;
    font-weight:500;
    color: var(--ink);
    white-space:nowrap;
    transition: border-color .15s ease, background .15s ease, color .15s ease, box-shadow .15s ease;
  }

  .chip-face .check{
    width:15px;
    height:15px;
    border-radius:50%;
    border: 1.5px solid #c3c8d6;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: border-color .15s ease, background .15s ease;
  }

  .chip-face .check svg{
    width:9px;
    height:9px;
    opacity:0;
    transform: scale(.6);
    transition: opacity .12s ease, transform .12s ease;
  }

  .chip input:hover ~ .chip-face{
    border-color:#c3c8d6;
  }

  .chip input:checked ~ .chip-face{
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--navy-deep);
  }

  .chip input:checked ~ .chip-face .check{
    background: var(--accent);
    border-color: var(--accent);
  }

  .chip input:checked ~ .chip-face .check svg{
    opacity:1;
    transform: scale(1);
  }

  .chip input:focus-visible ~ .chip-face{
    outline: 2px solid var(--accent);
    outline-offset:2px;
  }

  .divider{
    height:1px;
    background: var(--line-soft);
    margin: 32px 0;
  }

  .actions{
    margin-top: 40px;
  }

  .actions .back-link{
    margin-bottom: 16px;
  }

  button{
    font-family: inherit;
    cursor:pointer;
  }

  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    padding:0;
    font-size:14px;
    font-weight:600;
    color: var(--ink-muted);
    transition: color .15s ease;
  }

  .back-link svg{
    width:16px;
    height:16px;
    transition: transform .15s ease;
  }

  .back-link:hover{
    color: var(--ink);
  }

  .back-link:hover svg{
    transform: translateX(-2px);
  }

  button.continue{
    width:100%;
    height:52px;
    border:none;
    border-radius: var(--radius);
    background: var(--navy-deep);
    color:#fff;
    font-size:15.5px;
    font-weight:600;
    letter-spacing:.01em;
    transition: background .15s ease, transform .05s ease;
  }

  button.continue:hover{
    background: var(--navy);
  }

  button.continue:active{
    transform: translateY(1px);
  }
</style>
</head>
<body>
  <div class="topbar"></div>
  <div class="card">
    <div class="progress">
      <span class="done"></span>
      <span class="done"></span>
    </div>
    <p class="eyebrow">Step 2 of 2</p>
    <h1>What's in your home?</h1>
    <p class="sub">Select what applies — we'll build a maintenance checklist for each one and skip the rest.</p>

    <div class="group">
      <div class="group-head">
        <span class="group-title">Systems</span>
      </div>
      <div class="chip-list">
        <label class="chip"><input type="checkbox" checked><span class="chip-face"><span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></span>Electrical Panel</span></label>
        <label class="chip"><input type="checkbox"><span class="chip-face"><span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></span>Furnace / Boiler</span></label>
        <label class="chip"><input type="checkbox" checked><span class="chip-face"><span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></span>HVAC</span></label>
        <label class="chip"><input type="checkbox"><span class="chip-face"><span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></span>Plumbing</span></label>
        <label class="chip"><input type="checkbox"><span class="chip-face"><span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></span>Sewer / Septic</span></label>
        <label class="chip"><input type="checkbox"><span class="chip-face"><span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></span>Sump Pump</span></label>
        <label class="chip"><input type="checkbox" checked><span class="chip-face"><span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></span>Water Heater</span></label>
      </div>
    </div>

    <div class="group">
      <div class="group-head">
        <span class="group-title">Exterior</span>
      </div>
      <div class="chip-list">
        <label class="chip"><input type="checkbox"><span class="chip-face"><span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></span>Basement / Crawlspace Waterproofing</span></label>
        <label class="chip"><input type="checkbox"><span class="chip-face"><span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></span>Deck / Porch</span></label>
        <label class="chip"><input type="checkbox"><span class="chip-face"><span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></span>Driveway / Walkways</span></label>
        <label class="chip"><input type="checkbox" checked><span class="chip-face"><span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></span>Foundation</span></label>
        <label class="chip"><input type="checkbox"><span class="chip-face"><span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></span>Garage Door</span></label>
        <label class="chip"><input type="checkbox" checked><span class="chip-face"><span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></span>Gutters</span></label>
        <label class="chip"><input type="checkbox" checked><span class="chip-face"><span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></span>Roof</span></label>
        <label class="chip"><input type="checkbox"><span class="chip-face"><span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></span>Siding</span></label>
        <label class="chip"><input type="checkbox"><span class="chip-face"><span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></span>Windows</span></label>
      </div>
    </div>

    <div class="group">
      <div class="group-head">
        <span class="group-title">Appliances</span>
      </div>
      <div class="chip-list">
        <label class="chip"><input type="checkbox" checked><span class="chip-face"><span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></span>Dishwasher</span></label>
        <label class="chip"><input type="checkbox"><span class="chip-face"><span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></span>Dryer</span></label>
        <label class="chip"><input type="checkbox" checked><span class="chip-face"><span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></span>Range / Oven</span></label>
        <label class="chip"><input type="checkbox" checked><span class="chip-face"><span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></span>Refrigerator</span></label>
        <label class="chip"><input type="checkbox"><span class="chip-face"><span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></span>Washer</span></label>
      </div>
    </div>

    <div class="group">
      <div class="group-head">
        <span class="group-title">Safety</span>
      </div>
      <div class="chip-list">
        <label class="chip"><input type="checkbox"><span class="chip-face"><span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></span>Chimney / Fireplace</span></label>
        <label class="chip"><input type="checkbox" checked><span class="chip-face"><span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></span>Smoke & CO Detectors</span></label>
      </div>
    </div>

    <div class="actions">
      <button class="back-link" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back
      </button>
      <button class="continue" type="button">Continue</button>
    </div>
  </div>
</body>
</html>
